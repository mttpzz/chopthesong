[project]
name = "chopsongs"
version = "0.1.0"
description = "ChopSongs — chop a track into its parts: samples, lyrics, genres and credits."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "diskcache>=5.6",
    "rapidfuzz>=3.9",
    "streamlit>=1.40",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Keep temp/cache out of %TEMP%: a broken pytest-current symlink there breaks teardown
# on this machine, and .pytest_cache has an ACL that denies access.
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
